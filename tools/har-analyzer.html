<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://david-fear.github.io/stylesheet.css" />
<title>HAR Analyzer</title>
<style>
  #dropzone {
    border: 2px dashed var(--primary);
    padding: 20px;
    text-align: center;
    cursor: pointer;
    margin-bottom: 20px;
    color: var(--text);
    background: #1a1a1a;
    border-radius: 8px;
    transition: background 0.2s;
  }
  #results {
    overflow-x: auto;
    max-width: 100%;
    border: 1px solid #333;
    border-radius: 8px;
    margin-top: 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: auto;
  }
  th, td {
    border: 1px solid #333;
    padding: 4px 6px;
    font-size: 10px;
    vertical-align: top;
    word-break: break-all;
    color: var(--text);
  }
  th {
    background: #2b2b2b;
    color: var(--primary);
    font-weight: 600;
    letter-spacing: 0.3px;
    position: sticky;
    top: 0;
    white-space: nowrap;
  }
  th.sortable {
    cursor: pointer;
    user-select: none;
  }
  th.sortable:hover {
    background: #353535;
  }
  /* Timestamp */
  th:nth-child(1), td:nth-child(1) { min-width: 85px; }
  /* Method */
  th:nth-child(2), td:nth-child(2) { min-width: 60px; }
  /* Status */
  th:nth-child(4), td:nth-child(4) { min-width: 45px; }
  /* Size */
  th:nth-child(5), td:nth-child(5) { min-width: 70px; }
  /* Time (s) */
  th:nth-child(6), td:nth-child(6) { min-width: 55px; }
  /* Origin - wrap only at dots, never mid-word */
  th:nth-child(7), td:nth-child(7) { min-width: 160px; word-break: normal; overflow-wrap: normal; }
  /* Content-Type */
  th:nth-child(8), td:nth-child(8) { min-width: 130px; }
  /* Payload - just fits the View button */
  th:nth-child(9), td:nth-child(9) { min-width: 0; width: 1%; white-space: nowrap; }
  tr:hover:not(.payload-row) td { background-color: #222; }
  #summary {
    margin-top: 16px;
    font-size: 14px;
    padding: 12px 16px;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 8px;
    color: var(--text);
    line-height: 1.8;
  }
  pre {
    background: #111;
    border: 1px solid #2a2a2a;
    padding: 10px;
    overflow: auto;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #c8d0da;
    border-radius: 4px;
    margin-top: 8px;
  }
  table button {
    padding: 2px 8px;
    font-size: 11px;
  }
  tr.payload-row td {
    background-color: #111;
    font-family: monospace;
  }
</style>
</head>
<body>
<!-- Dynamic sidebar menu START - right after BODY tag -->
<div id="menu-container"></div>
<script>
  fetch('https://david-fear.github.io/components/menu.html')
    .then(response => response.text())
    .then(data => {
      const container = document.getElementById('menu-container');
      container.innerHTML = data;

      // Now attach event listeners because the elements exist
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('menu-nav');

      toggle.addEventListener('click', () => {
        const expanded = toggle.getAttribute('aria-expanded') === 'true';
        toggle.setAttribute('aria-expanded', String(!expanded));
        if (menu.hasAttribute('hidden')) {
          menu.removeAttribute('hidden');
        } else {
          menu.setAttribute('hidden', '');
        }
      });

      toggle.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          toggle.click();
        }
      });
    })
    .catch(e => console.error('Failed to load menu:', e));
</script>
<!-- Dynamic sidebar menu END -->

  <header>
    <h1>HAR Analyzer</h1>
    <p>Drop a HAR file to inspect requests, timings, and payloads. Nothing is uploaded &mdash; all processing is local.</p>
  </header>

<main>
<div id="dropzone">Drop HAR file here or click to select</div>
<input type="file" id="fileInput" accept=".har" style="display:none;" />

<div id="summary"></div>
<div id="results" class="wide"></div>
<pre id="rawJson"></pre>

<script>
let har = null;

const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const summaryDiv = document.getElementById("summary");
const resultsDiv = document.getElementById("results");
const rawJson = document.getElementById("rawJson");

dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.style.background = "#222"; });
dropzone.addEventListener("dragleave", () => dropzone.style.background = "#1a1a1a" );
dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.style.background = "";
    if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener("change", e => handleFile(e.target.files[0]));

function timeColor(s) {
    if (s < 0.1) return "background-color:#0d2b0d;color:#7dff7d";    // fast
    if (s < 1) return "background-color:#2b2200;color:#ffcc00";       // medium
    return "background-color:#2b0d0d;color:#ff6666";                   // slow
}
  
function statusColor(status) {
    if (status === 200) return "background-color:#0d2b0d;color:#7dff7d";
    if (status >= 201 && status < 300) return "background-color:#0d2b0d;color:#a0e8a0";
    return "background-color:#2b0d0d;color:#ff6666";
}

function methodColor(method) {
    switch ((method || '').toUpperCase()) {
        case 'GET': return "color:#7dff7d;font-weight:600";
        case 'POST': return "color:#4db8ff;font-weight:600";
        case 'PUT': return "color:#ffcc00;font-weight:600";
        case 'PATCH': return "color:#c792ea;font-weight:600";
        case 'DELETE': return "color:#ff6666;font-weight:600";
        case 'OPTIONS': return "color:#9aa0a6;font-weight:600";
        case 'HEAD': return "color:#7de8ff;font-weight:600";
        default: return "font-weight:600";
    }
}
  
function handleFile(file) {
    const reader = new FileReader();
    reader.onload = evt => {
        try {
            const obj = JSON.parse(evt.target.result);
            har = obj; // store globally
            currentEntries = (obj.log?.entries || []).slice();
            sortCol = null;
            sortDir = 1;
            summarize(obj);
            renderTable(currentEntries);
        } catch (e) {
            alert("Failed to parse HAR: " + e.message);
        }
    };
    reader.readAsText(file);
}

function summarize(obj) {
    if (!obj.log || !obj.log.entries) {
        summaryDiv.textContent = "Invalid HAR format";
        return;
    }

    const entries = obj.log.entries;
    const totalRequests = entries.length;
    const totalBytes = entries.reduce((sum, e) => sum + (e.response?.content?.size || 0), 0);
    const totalTime = entries.reduce((sum, e) => sum + (e.time || 0), 0);

    summaryDiv.innerHTML = `
        <strong>Total requests:</strong> ${totalRequests}<br>
        <strong>Total bytes:</strong> ${totalBytes.toLocaleString()}<br>
        <strong>Total time:</strong> ${totalTime.toFixed(2)} ms
    `;

    rawJson.textContent = JSON.stringify(
        {
            log: {
                version: har?.log?.version,
                creator: har?.log?.creator
            },
            summary: {
                totalRequests,
                totalBytes,
                totalTime
            }
        },
        null,
        2
    );
}

function getOrigin(e) {
    const h = (e.request?.headers || []).find(h => h.name.toLowerCase() === 'origin');
    return h ? h.value : '';
}

function getContentType(e) {
    const h = (e.response?.headers || []).find(h => h.name.toLowerCase() === 'content-type');
    return h ? h.value : '';
}

// Only break Origin text at dots, never mid-label
function wrapOrigin(str) {
    return escapeHtml(str).replace(/\./g, '.<wbr>');
}

function formatTimestamp(e) {
    const d = new Date(e.startedDateTime);
    if (!e.startedDateTime || isNaN(d.getTime())) return '';
    const pad = (n, len = 2) => String(n).padStart(len, '0');
    return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
}

function getSortValue(e, col) {
    switch (col) {
        case 0: return e.startedDateTime ? new Date(e.startedDateTime).getTime() : 0;
        case 1: return (e.request?.method || '').toLowerCase();
        case 2: return (e.request?.url || '').toLowerCase();
        case 3: return e.response?.status || 0;
        case 4: return e.response?.content?.size || 0;
        case 5: return e.time || 0;
        case 6: return getOrigin(e).toLowerCase();
        case 7: return getContentType(e).toLowerCase();
        default: return '';
    }
}

function sortTable(col) {
    sortDir = (sortCol === col) ? -sortDir : 1;
    sortCol = col;
    currentEntries.sort((a, b) => {
        const va = getSortValue(a, col);
        const vb = getSortValue(b, col);
        if (va < vb) return -1 * sortDir;
        if (va > vb) return 1 * sortDir;
        return 0;
    });
    renderTable(currentEntries);
}

function headerCell(label, col) {
    const arrow = sortCol === col ? (sortDir === 1 ? ' \u25b2' : ' \u25bc') : '';
    return `<th class="sortable" onclick="sortTable(${col})">${label}${arrow}</th>`;
}

function renderTable(entries) {
    let html = `
    <table class="wide">
        <tr>
            ${headerCell('Timestamp', 0)}
            ${headerCell('Method', 1)}
            ${headerCell('URL', 2)}
            ${headerCell('Status', 3)}
            ${headerCell('Size', 4)}
            ${headerCell('Time (s)', 5)}
            ${headerCell('Origin', 6)}
            ${headerCell('Content-Type', 7)}
            <th>Payload</th>
        </tr>
    `;

    entries.forEach((e, idx) => {
        const req = e.request;
        const res = e.response;

        const origin = getOrigin(e);
        const contentType = getContentType(e);

        const hasJSON = req?.postData?.text ? true : false;
        const hasParams = req?.postData?.params?.length > 0;

        // Prepare safe escaped JSON for display
        const payloadObj = {
            json: tryParseJson(req?.postData?.text) || req?.postData?.text || null,
            params: req?.postData?.params || null
        };
        const payloadDisplay = escapeHtml(JSON.stringify(payloadObj, null, 2));

        html += `
        <tr>
            <td>${formatTimestamp(e)}</td>
            <td style="${methodColor(req?.method)}">${escapeHtml(req?.method || '')}</td>
            <td>${escapeHtml(req?.url || '')}</td>
            <td style="${statusColor(res?.status)}">${res?.status || ''}</td>
            <td>${res?.content?.size || 0}</td>
            <td style="${timeColor((e.time || 0) / 1000)}">${((e.time || 0) / 1000).toFixed(2)}</td>
            <td>${wrapOrigin(origin)}</td>
            <td>${escapeHtml(contentType)}</td>
            <td>
                ${(hasJSON || hasParams)
                    ? `<button onclick="togglePayload(${idx})">View</button>`
                    : ""
                }
            </td>
        </tr>
        <tr id="payload-${idx}" class="payload-row" style="display:none;">
            <td colspan="9">
                <pre>${payloadDisplay}</pre>
            </td>
        </tr>
        `;
    });

    html += "</table>";
    resultsDiv.innerHTML = html;
}

function togglePayload(i) {
    const row = document.getElementById(`payload-${i}`);
    row.style.display = row.style.display === "none" ? "table-row" : "none";
}

let currentEntries = [];
let sortCol = null;
let sortDir = 1;

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>"']/g, function(m) {
        return ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[m];
    });
}

function tryParseJson(text) {
    if (!text) return null;
    try {
        return JSON.parse(text);
    } catch {
        return null;
    }
}
</script>
</main>

<!-- Footer placeholder -->
<div id="footer-container"></div>
<script>
  fetch('https://david-fear.github.io/components/footer.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('footer-container').innerHTML = data;
    })
    .catch(error => {
      console.error('Failed to load footer:', error);
    });
</script>

</body>
</html>

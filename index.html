<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>David Fear's Site</title>

  <!-- Link to external stylesheet -->
  <link rel="stylesheet" href="https://david-fear.github.io/stylesheet.css" />

  <style>
    /* --- animated background --- */
    body {
      background: linear-gradient(-45deg, #0d1b2a, #121212, #1a0a1e, #0a1a2e);
      background-size: 400% 400%;
      animation: bgPulse 20s ease infinite;
    }
    @keyframes bgPulse {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* --- button grid --- */
    .button-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
      flex: 1;
      position: relative;
      z-index: 1;
    }

    /* --- buttons --- */
    button {
      width: 100%;
      font-size: 1.1em;
      padding: 16px 12px;
      border: 1px solid rgba(77, 184, 255, 0.2);
      border-radius: 8px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 22px rgba(77, 184, 255, 0.6), 0 4px 14px rgba(0, 0, 0, 0.4);
      border-color: rgba(77, 184, 255, 0.9);
    }

    /* --- sections with vertical category label --- */
    section {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-left: 4px solid transparent;
      padding: 0.75rem 1.5rem;
      text-align: left;
    }
    section h2 {
      writing-mode: vertical-rl;
      transform: rotate(185deg);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0em;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: -15px;
      opacity: 0.7;
    }

    section:nth-of-type(1) { border-left-color: #4db8ff; }
    section:nth-of-type(2) { border-left-color: #a78bfa; }
    section:nth-of-type(3) { border-left-color: #34d399; }
    section:nth-of-type(4) { border-left-color: #fbbf24; }
    section:nth-of-type(5) { border-left-color: #f87171; }
    section:nth-of-type(6) { border-left-color: #6b7280; }

    section:nth-of-type(1) h2 { color: #4db8ff; }
    section:nth-of-type(2) h2 { color: #a78bfa; }
    section:nth-of-type(3) h2 { color: #34d399; }
    section:nth-of-type(4) h2 { color: #fbbf24; }
    section:nth-of-type(5) h2 { color: #f87171; }
    section:nth-of-type(6) h2 { color: #9ca3af; }

    /* --- per-section button colours --- */
    section:nth-of-type(1) button { background: #4db8ff; border-color: rgba(77, 184, 255, 0.3); }
    section:nth-of-type(2) button { background: #a78bfa; border-color: rgba(167, 139, 250, 0.3); }
    section:nth-of-type(3) button { background: #34d399; border-color: rgba(52, 211, 153, 0.3); color: #111; }
    section:nth-of-type(4) button { background: #fbbf24; border-color: rgba(251, 191, 36, 0.3); color: #111; }
    section:nth-of-type(5) button { background: #f87171; border-color: rgba(248, 113, 113, 0.3); }
    section:nth-of-type(6) button { background: #6b7280; border-color: rgba(107, 114, 128, 0.3); opacity: 0.7; font-size: 1em; }

    section:nth-of-type(1) button:hover { box-shadow: 0 0 22px rgba(77, 184, 255, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #4db8ff; }
    section:nth-of-type(2) button:hover { box-shadow: 0 0 22px rgba(167, 139, 250, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #a78bfa; }
    section:nth-of-type(3) button:hover { box-shadow: 0 0 22px rgba(52, 211, 153, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #34d399; }
    section:nth-of-type(4) button:hover { box-shadow: 0 0 22px rgba(251, 191, 36, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #fbbf24; }
    section:nth-of-type(5) button:hover { box-shadow: 0 0 22px rgba(248, 113, 113, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #f87171; }
    section:nth-of-type(6) button:hover { box-shadow: 0 0 22px rgba(107, 114, 128, 0.7), 0 4px 14px rgba(0,0,0,0.4); border-color: #9ca3af; }
  </style>
</head>

<body>
  <!-- Dynamic sidebar menu START -->
  <div id="menu-container"></div>
  <script>
    fetch('https://david-fear.github.io/components/menu.html')
      .then(response => response.text())
      .then(data => {
        const container = document.getElementById('menu-container');
        container.innerHTML = data;

        const toggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('menu-nav');

        toggle.addEventListener('click', () => {
          const expanded = toggle.getAttribute('aria-expanded') === 'true';
          toggle.setAttribute('aria-expanded', String(!expanded));
          if (menu.hasAttribute('hidden')) {
            menu.removeAttribute('hidden');
          } else {
            menu.setAttribute('hidden', '');
          }
        });

        toggle.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggle.click();
          }
        });
      })
      .catch(e => console.error('Failed to load menu:', e));
  </script>
  <!-- Dynamic sidebar menu END -->
